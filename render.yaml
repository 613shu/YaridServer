# Render Blueprint — creates the web service for the API.
# The database lives on Supabase (free), so its URL is entered by hand in Render.
services:
  - type: web
    name: hayarid-hagadol-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "ראש הקהל"
      - key: DEMO_MERCHANT_EMAIL
        sync: false
      - key: DEMO_MERCHANT_PASSWORD
        sync: false
